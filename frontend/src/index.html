<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MyBody365</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Suivi du poids, photos de progression, repas et calories, flamme quotidienne et prévision de ton objectif.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyBody365">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MyBody365">
  <meta property="og:image" content="https://mybody365.mbonnici.fr/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- a forced light / dark choice applies before the first paint (its SHA-256 is in the CSP) -->
  <script>try{var t=localStorage.getItem('mb.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <!-- the hero title is the largest paint: its font must not wait for the stylesheet -->
  <link rel="preload" href="/fonts/archivo-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 1.15: the logo in the middle while the app starts (core/ui/boot-splash.ts); the prerendered public pages drop it.
       1.20.2: nothing scrolls while it is up; in the iPhone's installed app it is centred on the screen itself, iOS giving
       a viewport too short for a moment at start (the logo started too high, then jumped: this script, its SHA-256 in the
       CSP); without network its ring stops and it says so (the message comes from boot-splash.ts) -->
  <script>try{var h=screen.height;if(navigator.standalone&&innerHeight>innerWidth&&h-innerHeight<121)document.documentElement.style.setProperty('--boot-cy',h/2+'px')}catch(e){}</script>
  <style id="boot-style">
    html{overflow:hidden}
    .boot{position:fixed;inset:0;z-index:2000;background:#f3f1ec;color:#16130f;--boot-dim:#57524a;transition:opacity .34s ease,visibility 0s .34s}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .boot{background:#0a0a0c;color:#f6f3ee;--boot-dim:#b3afa7}}
    :root[data-theme=dark] .boot{background:#0a0a0c;color:#f6f3ee;--boot-dim:#b3afa7}
    .boot svg{position:absolute;left:50%;top:var(--boot-cy,50%);width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:28%;box-shadow:0 18px 50px -18px rgba(255,90,30,.55);animation:boot-in .5s cubic-bezier(.2,.9,.3,1.15) both;transition:transform .34s ease}
    .boot-off{position:absolute;left:24px;right:24px;top:calc(var(--boot-cy,50%) + 76px);display:grid;gap:2px;margin:0;text-align:center;font:500 15px/1.45 "Inter Variable",ui-sans-serif,system-ui,-apple-system,sans-serif;animation:boot-off .4s ease both}
    .boot-off strong{font-size:16px;font-weight:700}
    .boot-off span{color:var(--boot-dim)}
    .boot.offline .boot-spin,.boot.offline .boot-ring{animation-play-state:paused}
    .boot.offline .boot-ring{opacity:.3;transition:opacity .4s ease}
    @keyframes boot-off{from{opacity:0;transform:translateY(6px)}}
    .boot-ring{stroke-dasharray:84 200;animation:boot-draw .9s .12s cubic-bezier(.65,0,.35,1) both}
    .boot-spin{transform-box:view-box;transform-origin:24px 24px;animation:boot-spin 1.5s 1s linear infinite}
    .boot-flame{transform-box:fill-box;transform-origin:50% 90%;animation:boot-flame .55s .3s cubic-bezier(.2,.9,.3,1.3) both,boot-breathe 1.3s .85s ease-in-out infinite alternate}
    .boot.leaving{opacity:0;visibility:hidden;pointer-events:none}
    .boot.leaving svg{transform:scale(1.14)}
    @keyframes boot-in{from{opacity:0;transform:scale(.82)}}
    @keyframes boot-draw{from{stroke-dashoffset:84}}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @keyframes boot-flame{from{opacity:0;transform:scale(.4)}}
    @keyframes boot-breathe{to{transform:scale(1.08)}}
    @media (prefers-reduced-motion:reduce){.boot svg,.boot-ring,.boot-spin,.boot-flame,.boot-off{animation:none}}
  </style>
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <svg viewBox="0 0 48 48" focusable="false">
      <defs>
        <linearGradient id="boot-g" x1="8" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ff3d1f"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffc23d"/>
        </linearGradient>
      </defs>
      <rect width="48" height="48" rx="14" fill="#0d0d10"/>
      <circle cx="24" cy="24" r="15" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="4.5"/>
      <g class="boot-spin"><circle class="boot-ring" cx="24" cy="24" r="15" fill="none" stroke="url(#boot-g)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-90 24 24)"/></g>
      <path class="boot-flame" fill="url(#boot-g)" d="M21.2 27.1a2.2 2.2 0 0 0 2.2-2.2c0-1.2-.44-1.76-.88-2.64-.94-1.88-.2-3.56 1.76-5.28.44 2.2 1.76 4.3 3.52 5.72 1.76 1.4 2.64 3.08 2.64 4.84a6.16 6.16 0 1 1-12.32 0c0-1.02.38-2.02.88-2.64a2.2 2.2 0 0 0 2.2 2.2z"/>
    </svg>
  </div>
  <app-root></app-root>
</body>
</html>
