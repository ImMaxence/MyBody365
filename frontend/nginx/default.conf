# MyBody365 frontend: the static Angular build (prerendered public pages + client-rendered app)
# and a reverse proxy to the Spring Boot API for /api, /webauthn and /login/webauthn.

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $http_x_forwarded_port $forwarded_port {
  default $http_x_forwarded_port;
  ''      $server_port;
}

upstream api {
  server backend:8080;
  keepalive 16;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  # progress photos and backup archives go through the API
  client_max_body_size 30m;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # ── API ────────────────────────────────────────────────────────────────────
  location ~ ^/(api/|webauthn/|login/webauthn$) {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # ── service worker & manifest: always revalidated ──────────────────────────
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/conf.d/security-headers.inc;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # ── hashed bundles and fonts: cached for a year ────────────────────────────
  location ~* ^/(chunk|main|polyfills|styles|worker)-[A-Za-z0-9_-]+\.(js|css)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /media/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /fonts/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=2592000" always;
  }
  location /icons/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # ── pages: prerendered file when there is one, the client-rendered shell otherwise ──
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /index.csr.html;
  }
}
