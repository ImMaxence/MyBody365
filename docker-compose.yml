# ──────────────────────────────────────────────────────────────────────────────
# MyBody365 — production stack, deployed by Coolify (Docker Compose build pack)
#
#   Cloudflare ─► Coolify/Traefik (TLS) ─► frontend:8080 (nginx: app + /api proxy) ─► backend:8080 ─► db
#
# Only `frontend` gets a domain in Coolify (https://mybody365.mbonnici.fr, port 8080); nothing is published.
# Secrets come from Coolify:
#   - SERVICE_USER_POSTGRES / SERVICE_PASSWORD_64_POSTGRES, SERVICE_USER_S3 / SERVICE_PASSWORD_64_S3: generated by Coolify on the first deployment and kept
#     after (never regenerate them: the database keeps the user and password it was created with);
#   - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAILS: entered in Environment Variables. They are required:
#     the deployment stops right away if one is missing.
# Local runs use docker-compose.local.yml instead.
# ──────────────────────────────────────────────────────────────────────────────

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    build:
      # root context: the image also ships CHANGELOG.md (the site's "Nouveautés" page)
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://db:5432/mybody365
      DB_USER: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PORT: "8080"
      APP_URL: https://mybody365.mbonnici.fr
      # Google OAuth client (sign-in, and Google Drive backups later): required
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      # the Google address(es) that are always admins, separated by ";": required
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      # real visitor IP from CF-Connecting-IP / X-Forwarded-For, scheme and host from Traefik
      TRUST_PROXY: "true"
      FORWARD_HEADERS_STRATEGY: framework
      COOKIE_SECURE: "true"
      # object storage (the storage service below); the credentials are generated by Coolify
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  storage:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    logging: *logging
    # SeaweedFS with its S3 gateway: photos and pictures (u/{user}/...). One identity, the backend.
    # 1.14: -volume.max=0, as many 1 GB volumes as the disk holds (the default 8 ran out: the bucket takes 7 at once, then the
    # filer could not write its log any more and the S3 reads timed out)
    environment:
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0 -metricsPort=9327
    volumes:
      - storage-data:/data
    expose:
      - "8333"
    healthcheck:
      # the S3 gateway answers 403 to anonymous requests: any HTTP answer means it is up
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    # 1.14: PostgreSQL 18.7 (12 November 2026: 52 security fixes); a minor version, the data stays as it is
    image: postgres:18.7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: mybody365
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:
