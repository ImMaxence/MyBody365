spring:
  application:
    name: mybody365
  datasource:
    # local defaults match docker-compose.dev.yml (host ports are offset to avoid clashes)
    url: ${DB_URL:jdbc:postgresql://localhost:5435/mybody365}
    username: ${DB_USER:mybody365}
    password: ${DB_PASSWORD:mybody365}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30d
    jdbc:
      # the tables come from Flyway (V1__init.sql)
      initialize-schema: never
      cleanup-cron: "0 */30 * * * *"
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # pictures are resized by the app before upload; backups (zip) can be much larger
      max-file-size: 512MB
      max-request-size: 512MB
      file-size-threshold: 2MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/api/auth/oauth2/code/google"

server:
  # 8082 locally (8080/8081 are often taken by other projects); the Docker image sets PORT=8080
  port: ${PORT:8082}
  # "framework" only behind a trusted reverse proxy (set together with TRUST_PROXY=true); otherwise a
  # client could spoof X-Forwarded-For and escape per-IP rate limiting.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    build:
      enabled: true

app:
  url: ${APP_URL:http://localhost:4300}
  # required, no default: the Google address(es) that are always admins, separated by ";"
  admin-emails: ${ADMIN_EMAILS}
  trust-proxy: ${TRUST_PROXY:false}
  # the session cookie (see SessionConfig): Secure in production, behind HTTPS
  cookie-secure: ${COOKIE_SECURE:false}
  # local only (refused unless app.url is localhost): /api/auth/dev-login opens a session without Google
  dev-login: ${DEV_LOGIN:false}
  recovery-link-hours: 24
  # the community's first recipes (resources/community), added once their Ciqual foods are there
  community-seed: ${COMMUNITY_SEED:true}
  rate-limit:
    enabled: true
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:600}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    access-request-per-hour: ${RATE_LIMIT_ACCESS_REQUEST_PER_HOUR:5}
    upload-per-hour: ${RATE_LIMIT_UPLOAD_PER_HOUR:120}
    food-search-per-minute: ${RATE_LIMIT_FOOD_SEARCH_PER_MINUTE:60}
  # photos and pictures: an S3-compatible service (SeaweedFS in the Compose files)
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:mybody365}
    access-key: ${S3_ACCESS_KEY:mybody365}
    secret-key: ${S3_SECRET_KEY:mybody365-local-secret}
    quota-mb: ${STORAGE_QUOTA_MB:2048}
    max-upload-mb: 20
  nutrition:
    off-user-agent: ${OFF_USER_AGENT:MyBody365}

logging:
  level:
    root: info
    fr.mbonnici: info
